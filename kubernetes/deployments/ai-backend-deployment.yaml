apiVersion: apps/v1
kind: Deployment
metadata: 
  name: ai-backend-deployment
  namespace: ai-cloud-architect
  labels:
    app: ai-backend
    
spec: 

  replicas: 3

  selector:
    matchLabels:
      app: ai-backend

  template:

    metadata:
      labels:
       app: ai-backend

    spec: 
      containers:
        - name: ai-backend
          image: ai-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http-backend
              protocol: TCP
          envFrom: 
            - configMapRef:
                name: ai-backend-config
            - secretRef:
                name: ai-backend-secret  