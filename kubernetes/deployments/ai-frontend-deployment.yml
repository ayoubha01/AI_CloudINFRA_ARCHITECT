apiVersion: apps/v1
kind: Deployment
metadata: 
  name: ai-frontend-deployment
  namespace: ai-cloud-architect
  labels:
    app: ai-frontend
spec: 
  replicas: 2
  selector:
    matchLabels: 
      app: ai-frontend    
  template:
    metadata:
      labels:
       app: ai-frontend
    spec: 
      containers:
        - name: ai-frontend
          image: ai-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: 
            - containerPort: 5173
              name: http-frontend
              protocol: TCP
          envFrom: 
            - configMapRef:
                name: ai-frontend-config