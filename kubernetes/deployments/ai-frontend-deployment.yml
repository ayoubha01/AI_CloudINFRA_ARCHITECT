apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend-deployment
  labels:
    app: frontend
    tier: frontend
spec: 
  replicas: 3 
  template:
    metadata:
      labels:
       app: frontend
    spec: 
      containers:
        - name: frontend
          image: ai-frontend:latest
  selector:
    matchLabels: 
      app: frontend    