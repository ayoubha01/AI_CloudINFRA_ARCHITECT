apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-backend-config
  namespace: ai-cloud-architect
  labels:
    app: ai-backend
data:
  PORT: "5000"
  OPENAI_MODEL: "openai/gpt-oss-20b"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-frontend-config
  namespace: ai-cloud-architect
  labels:
    app: ai-frontend
data:
  VITE_API_PROXY_TARGET: "http://ai-backend-service:5000"